name: Deploy Lambda

# TODO
# To maintain sanity, segregate lib as layer and keep code alone packaged separately

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: stocks-tracker-lambda
  LAMBDA_FUNCTION_NAME: my-sample-function
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      artifact-name: lambda.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Build Lambda package
        run: |
          mkdir package

          # Install dependencies into deployment package
          uv export --no-dev --format requirements-txt > requirements.txt

          pip install \
            -r requirements.txt \
            -t package

          # Copy application code
          cp -r src/* package/

          cd package
          zip -r ../lambda.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload ZIP to S3
        run: |
          aws s3 cp lambda.zip s3://${S3_BUCKET}/lambda.zip

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${LAMBDA_FUNCTION_NAME} \
            --s3-bucket ${S3_BUCKET} \
            --s3-key lambda.zip